site_name: Enfegra Knowledge Hub
repo_url: https://github.com/enfegra/knowledge-hub
repo_name: enfegra/knowledge-hub
edit_uri: blob/main/docs/

theme:
  name: material
  logo: images/enfegra-logo.jpg
  favicon: images/favicon.png
  palette:
    primary: black
  features:
    - navigation.path
    - toc.follow

markdown_extensions:
  - toc:
      permalink: true

extra:
  generator: false

nav:
  - "Home": index.md