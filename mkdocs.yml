site_name: Enfegra Knowledge Hub
repo_url: https://github.com/enfegra/knowledge-hub
repo_name: enfegra/knowledge-hub
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    primary: black
  features:
    - navigation.tabs
    - navigation.path
    - toc.follow

markdown_extensions:
  - toc:
      permalink: true

nav:
  - "Knowledge Hub": index.md