name: mkdocs-deployment
on:
  push:
    branches:
      - main
    paths:
      - 'docs/'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/mkdocs-deploy.yml'
      

jobs:
  deploy-mkdocs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install mkdocs-material

      - name: Hide site title in left sidebar
        run: |
          mkdir -p docs/stylesheets
          cat << 'EOF' >> docs/stylesheets/extra.css
          @media screen and (min-width: 76.25em) {
            .md-nav--primary > .md-nav__title[for="__drawer"] {
              display: none;
            }
          }
          EOF
          if ! grep -q "extra_css:" mkdocs.yml; then
            echo -e "\nextra_css:\n  - stylesheets/extra.css" >> mkdocs.yml
          elif ! grep -q "stylesheets/extra.css" mkdocs.yml; then
            sed -i '/extra_css:/a \  - stylesheets/extra.css' mkdocs.yml
          fi

      - run: mkdocs gh-deploy --force