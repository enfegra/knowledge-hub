name: mkdocs-deployment
on:
  push:
    branches:
      - main
    paths:
      - 'docs/'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/mkdocs-deploy.yml'
      

jobs:
  deploy-mkdocs:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install mkdocs-material

      - run: mkdocs gh-deploy --force