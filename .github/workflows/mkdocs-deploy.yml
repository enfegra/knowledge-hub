name: mkdocs-deployment

on:
  push:
    branches:
      - main
    paths:
      - 'docs/'
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/mkdocs-deploy.yml'
      
jobs:
  deploy-mkdocs:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Hide site title in left sidebar and adjust header margin
        run: |
          mkdir -p docs/stylesheets
          cat << 'EOF' >> docs/stylesheets/extra.css
          @media screen and (min-width: 76.25em) {
            .md-nav--primary > .md-nav__title[for="__drawer"] {
              display: none;
            }
          }
          [dir="ltr"] .md-header__title {
            margin-left: 0 !important;
          }
          .md-header__topic {
            font-weight: 500 !important;
          }
          EOF
          if ! grep -q "extra_css:" mkdocs.yml; then
            echo -e "\nextra_css:\n  - stylesheets/extra.css" >> mkdocs.yml
          elif ! grep -q "stylesheets/extra.css" mkdocs.yml; then
            sed -i '/extra_css:/a \  - stylesheets/extra.css' mkdocs.yml
          fi
      
      - name: Customize UI styles and remove footer credit
        run: |
          mkdir -p docs/stylesheets
          cat << 'EOF' >> docs/stylesheets/extra.css
          @media screen and (min-width: 76.25em) {
            .md-nav--primary > .md-nav__title[for="__drawer"] {
              display: none;
            }
          }
          [dir="ltr"] .md-header__title {
            margin-left: 0 !important;
          }
          EOF

      - name: Deploy Mkdocs
        run: mkdocs gh-deploy --force